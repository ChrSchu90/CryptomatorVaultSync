services:
  cryptomator-vault-sync:
    image: ghcr.io/chrschu90/cryptomator-vault-sync:1
    container_name: cryptomator-vault-sync
    #restart: unless-stopped                                    # Recommended for scheduled mode
    network_mode: none                                          # Recommended for `UPSTREAM_ENABLED=false`
    cap_add:
      - SYS_ADMIN                                               # Required
    devices:
      - /dev/fuse:/dev/fuse                                     # Required 
    security_opt:
      - apparmor:unconfined                                     # Required
    environment:
      CRYPTOMATOR_VAULT_PASSWORD: "MyVaultPassword"             # Required
      #CRYPTOMATOR_VAULT_PASSWORD_FILE: /config/vault-password  # Optional replacement for CRYPTOMATOR_VAULT_PASSWORD
      PUID: 1000                                                # Optional [default=1000] User ID used to run the sync process 
      PGID: 1000                                                # Optional [default=1000] Group ID used to run the sync process
      UMASK: 022                                                # Optional [default=022] File creation mask; use 002 for shared folders when group-write access is required
      SYNC_DIR: /sync                                           # Optional [default=/sync]
      VAULT_ENCRYPTED_DIR: /vault-encrypted                     # Optional [default=/vault-encrypted]
      CRYPTOMATOR_MOUNT_MODE: fuse                              # Optional [default=fuse] fuse, webdav
      CRYPTOMATOR_VAULT_FIX_PERMISSIONS: false                  # Optional [default=false] Fix encrypted vault permissions after sync for shared-folder access
      MOUNT_TIMEOUT_SECONDS: 60                                 # Optional [default=60]
      SYNC_CRON: ""                                             # Optional [default=] empty=one-shot, cron expression=scheduled mode
      RSYNC_DELETE: false                                       # Optional [default=false] Do not enable unless /sync is intended to be the authoritative source!
      RSYNC_INPLACE: false                                      # Optional [default=false] --inplace for rsync
      RSYNC_EXCLUDE_FILE: /config/rsync-exclude.txt             # Optional [default=] file that is used for rsync --exclude-from "$RSYNC_EXCLUDE_FILE"
      RSYNC_ARGS: '-rtvi --no-owner --no-group --no-perms'      # Optional [default=-rtvi --no-owner --no-group --no-perms]
      RSYNC_EXTRA_ARGS:                                         # Optional [default=]
      UPSTREAM_ENABLED: false                                   # Optional [default=false]
      UPSTREAM_CHECK: false                                     # Optional [default=false] run rclone check after successful upstream sync/copy
      UPSTREAM_FAIL_ACTION: continue                            # Optional [default=continue]
      UPSTREAM_MODE: sync                                       # Optional [default=sync] sync (one-way local vault -> cloud), copy (copy new/changed files local vault -> cloud, no deletes)
      UPSTREAM_DESTINATIONS: remote:CryptomatorVault            # Required if UPSTREAM_ENABLED=true; remote must match a section in rclone.conf
      UPSTREAM_CONFIG: /config/rclone.conf                      # Optional [default=/config/rclone.conf]
      UPSTREAM_EXTRA_ARGS:                                      # Optional [default=]
      UPSTREAM_START_DELAY_SECONDS: 0                           # Optional [default=0] delay after unmounting the vault before running rclone
      TZ: Europe/Berlin                                         # Optional for correct timestamps
    volumes:
      - '/example/sync:/sync:ro'                                # One-Way sync source, you can also mount multiple sub-directories, but /sync must be the root directory.
      - '/example/config:/config:ro'                            # Contains config files for e.g. rclone or rsync-exclude.txt
      - '/example/vault:/vault-encrypted'                       # A Cryptomator vault must be inside the mount, can also be linked to a OneDrive synced directory
      - '/example/state:/state'                                 # Optional directory with status files for monitoring
