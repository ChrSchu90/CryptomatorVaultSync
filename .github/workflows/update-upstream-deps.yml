name: Update Upstream Dependencies

# Required Repo Setting!!! Settings → Actions → General → Workflow permissions [`Allow GitHub Actions to create and approve pull requests`]

on:
  schedule:
    - cron: '0 10 * * 5' # Every Friday at 10:00 UTC
  workflow_dispatch:

concurrency:
  group: update-upstream-deps
  cancel-in-progress: true

jobs:
  update:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    
    - name: Get Dependency Version Info
      id: versions
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        
        cryptomator_current="$(sed -n -E 's/^ARG CRYPTOMATOR_CLI_RELEASE=//p' Dockerfile | head -n1)"
        echo "cryptomator_current=$cryptomator_current" >> "$GITHUB_OUTPUT"
        echo "::notice::[info] cryptomator_current=$cryptomator_current"
        cryptomator_latest="$(gh release view --repo cryptomator/cli --json tagName --jq '.tagName' | sed 's/^v//')"
        echo "cryptomator_latest=$cryptomator_latest" >> "$GITHUB_OUTPUT"
        echo "::notice::[info] cryptomator_latest=$cryptomator_latest"
        [[ "$cryptomator_current" != "$cryptomator_latest" ]] && cryptomator_changed=true || cryptomator_changed=false
        echo "cryptomator_changed=$cryptomator_changed" >> "$GITHUB_OUTPUT"
        echo "::notice::[info] cryptomator_changed=$cryptomator_changed"
        
        rclone_current="$(sed -n -E 's/^ARG RCLONE_RELEASE=//p' Dockerfile | head -n1)"
        echo "rclone_current=$rclone_current" >> "$GITHUB_OUTPUT"
        echo "::notice::[info] rclone_current=$rclone_current"
        rclone_latest="$(gh release view --repo rclone/rclone --json tagName --jq '.tagName' | sed 's/^v//')"        
        echo "rclone_latest=$rclone_latest" >> "$GITHUB_OUTPUT"
        echo "::notice::[info] rclone_latest=$rclone_latest"
        [[ "$rclone_current" != "$rclone_latest" ]] && rclone_changed=true || rclone_changed=false
        echo "rclone_changed=$rclone_changed" >> "$GITHUB_OUTPUT"
        echo "::notice::[info] rclone_changed=$rclone_changed"

        supercronic_current="$(sed -n -E 's/^ARG SUPERCRONIC_RELEASE=//p' Dockerfile | head -n1)"
        echo "supercronic_current=$supercronic_current" >> "$GITHUB_OUTPUT"
        echo "::notice::[info] supercronic_current=$supercronic_current"
        supercronic_latest="$(gh release view --repo aptible/supercronic --json tagName --jq '.tagName' | sed 's/^v//')"
        echo "supercronic_latest=$supercronic_latest" >> "$GITHUB_OUTPUT"
        echo "::notice::[info] supercronic_latest=$supercronic_latest"
        [[ "$supercronic_current" != "$supercronic_latest" ]] && supercronic_changed=true || supercronic_changed=false
        echo "supercronic_changed=$supercronic_changed" >> "$GITHUB_OUTPUT"
        echo "::notice::[info] supercronic_changed=$supercronic_changed"

        [[ "$rclone_changed" == "true" || "$cryptomator_changed" == "true" || "$supercronic_changed" == "true" ]] && update_available=true || update_available=false
        echo "update_available=$update_available" >> "$GITHUB_OUTPUT"
        echo "::notice::[info] update_available=$update_available"

    - name: Update Dependency Versions
      if: ${{ steps.versions.outputs.update_available == 'true' }}
      run: |
        set -euo pipefail
        
        sed -i -E 's/^(ARG CRYPTOMATOR_CLI_RELEASE=).*/\1${{ steps.versions.outputs.cryptomator_latest }}/' Dockerfile
        sed -i -E 's/^(CRYPTOMATOR_CLI_RELEASE=).*/\1${{ steps.versions.outputs.cryptomator_latest }}/' debug.sh

        sed -i -E 's/^(ARG RCLONE_RELEASE=).*/\1${{ steps.versions.outputs.rclone_latest }}/' Dockerfile
        sed -i -E 's/^(RCLONE_RELEASE=).*/\1${{ steps.versions.outputs.rclone_latest }}/' debug.sh

        sed -i -E 's/^(ARG SUPERCRONIC_RELEASE=).*/\1${{ steps.versions.outputs.supercronic_latest }}/' Dockerfile
        sed -i -E 's/^(SUPERCRONIC_RELEASE=).*/\1${{ steps.versions.outputs.supercronic_latest }}/' debug.sh
    
    - name: Create GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ secrets.UPDATE_BOT_CLIENT_ID }}
        private-key: ${{ secrets.UPDATE_BOT_PRIVATE_KEY }}
    
    - name: Create Pull Request
      if: ${{ steps.versions.outputs.update_available == 'true' }}
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ steps.app-token.outputs.token }}
        branch: feature/UpstreamDependencyUpdate
        sign-commits: true
        delete-branch: true
        reviewers: ${{ github.repository_owner }}
        assignees: ${{ github.repository_owner }}
        labels: |
          enhancement
          dependencies
          bot
        title: "Update Upstream Dependencies"
        commit-message: "Update Upstream Dependencies"
        body: |
          Updated upstream dependency:
          - [Cryptomator CLI](https://github.com/cryptomator/cli): `${{ steps.versions.outputs.cryptomator_current }}` to `${{ steps.versions.outputs.cryptomator_latest }}`
          - [Supercronic](https://github.com/aptible/supercronic): `${{ steps.versions.outputs.supercronic_current }}` to `${{ steps.versions.outputs.supercronic_latest }}`
          - [Rclone](https://github.com/rclone/rclone): `${{ steps.versions.outputs.rclone_current }}` to `${{ steps.versions.outputs.rclone_latest }}`
